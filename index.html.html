var CONTR=[["i'm","i am"],["you're","you are"],["he's","he is"],["she's","she is"],["it's","it is"],["we're","we are"],["they're","they are"],["isn't","is not"],["aren't","are not"],["don't","do not"],["doesn't","does not"]];
function normA(s){
  s=s.replace(/[’‘`]/g,"'").toLowerCase().replace(/[.!?,]/g,' ').replace(/\s+/g,' ').trim();
  CONTR.forEach(function(c){ s=s.split(c[0]).join(c[1]); });
  return s.replace(/\s+/g,' ').trim();
}

   '<input class="inp '+(ty.state==='ok'?'ok':ty.state==='no'?'no':'')+'" id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="English translation" placeholder="Type in English"'+(ty.state==='ok'||ty.state==='reveal'?' disabled':'')+'>'+(hint?'<p class="hint">'+hint+'</p>':'');

  if(st.ex.length) h+='<div class="plan">'+st.ex.map(function(e,i){ return '<div class="ps"><div class="t"><b>'+e[0].replace(/\b(the|The)\b/g,'<mark>$1</mark>')+'</b><br><span class="hint">'+e[1]+'</span></div>'+(canSpeak?'<button class="btn" data-say="'+i+'" aria-label="Listen">🔊</button>':'')+'</div>'; }).join('')+'</div>';
  if(ck){
    h+='<h3>Check yourself</h3><div class="q">'+(ck.q.indexOf('___')>-1?ck.q.replace('___','<span class="blank'+(an?' f':'')+'">'+(an?ck.right:'&nbsp;')+'</span>'):ck.q)+'</div><div class="opts">'+ck.o.map(function(o,k){ var cls='opt',mk2=''; if(an){ if(k===ck.a){ cls+=' good'; mk2='✓ '; } else if(k===th.ans[th.i]){ cls+=' bad'; mk2='✗ '; } } return '<button class="'+cls+'" data-k="'+k+'"'+(an?' disabled':'')+'>'+mk2+o+'</button>'; }).join('')+'</div>';
    if(an){ var ok=th.ans[th.i]===ck.a; h+='<div class="fb'+(ok?'':' no')+'"><b>'+(ok?'Correct!':'Not quite. The answer is "'+ck.right+'".')+'</b>'+ck.w+'</div>'; }
  }
  h+='<div class="row" style="margin-top:14px">'+(th.i>0?'<button class="btn" id="pv">← Back</button>':'')+(th.i<TH.length-1?'<button class="btn main" id="nx">Next step →</button>':'<button class="btn main" id="gp">Practice in Grammar →</button><button class="btn" id="rs">Start again</button>')+'</div></div>';
  $('#view').innerHTML=h;
  var ss=document.querySelectorAll('[data-say]'); for(var i=0;i<ss.length;i++) ss[i].onclick=function(){ say(st.ex[parseInt(this.getAttribute('data-say'),10)][0].replace(/\/.*$/,'')); };
  var os=document.querySelectorAll('.opt'); for(var j=0;j<os.length;j++) os[j].onclick=function(){ if(th.ans[th.i]!==undefined) return; th.ans[th.i]=parseInt(this.getAttribute('data-k'),10); if(th.ans[th.i]===ck.a) addScore(); renderThe(); };
  if($('#nx')) $('#nx').onclick=function(){ th.i++; renderThe(); window.scrollTo(0,0); };
  if($('#pv')) $('#pv').onclick=function(){ th.i--; renderThe(); window.scrollTo(0,0); };
  if($('#gp')) $('#gp').onclick=function(){ gTopic='the'; setTab('gram'); };
  if($('#rs')) $('#rs').onclick=startThe;
}

/* ============ SPEAK ============ */
var sp={list:[],i:0}, left=90;
function startSpeak(){ sp={list:SPEAK.slice(),i:0}; renderSpeak(); }
function renderSpeak(){
  stopTimer(); left=90; var c=sp.list[sp.i];
  $('#view').innerHTML='<div class="card"><div class="row between"><h2 style="margin:0">'+c.t+'</h2><p class="gram">'+c.g+'</p></div><p class="sit">'+c.s+'</p><h3>Your job</h3><ul class="say">'+c.say.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul><h3>Useful phrases</h3><div class="phr">'+c.ph.map(function(x){ return '<span>'+x+'</span>'; }).join('')+'</div>'+
   '<div class="row" style="margin-top:14px"><div class="timer" id="tm" role="timer">'+fmt(left)+'</div><button class="btn sun" id="ts">Start 90 sec</button><button class="btn" id="pv">← Back</button><button class="btn main" id="nx">Next topic →</button></div><p class="hint" id="tmsg" style="margin-top:6px">Speak without stopping. Small mistakes are okay.</p>'+
   '<div class="tutor"><b>Tutor asks next:</b><ul>'+c.tutor.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul></div><p class="hint" style="margin-top:10px">Topic '+(sp.i+1)+' of '+sp.list.length+'. Then swap roles.</p></div>';
  $('#ts').onclick=function(){ stopTimer(); left=90; $('#tm').textContent=fmt(left); $('#tmsg').textContent='Go! Speak in English.'; timerId=setInterval(function(){ left--; $('#tm').textContent=fmt(left); if(left<=0){ stopTimer(); $('#tmsg').textContent='Time! Now answer your tutor\'s questions.'; addScore(); } },1000); };
  $('#nx').onclick=function(){ sp.i=(sp.i+1)%sp.list.length; renderSpeak(); };
  $('#pv').onclick=function(){ sp.i=(sp.i+sp.list.length-1)%sp.list.length; renderSpeak(); };
}

upM();
setTab('plan');
</script>
